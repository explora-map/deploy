services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: explora-postgres
    environment:
      POSTGRES_DB: explora_map
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d explora_map"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  backend:
    build: ./backend
    container_name: explora-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/explora_map
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL}
    ports:
      - "8080:8080"
    networks:
      - default
      - postal_postal-net

  frontend:
    build: ./frontend
    container_name: explora-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/certbot/webroot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - default
      - postal_postal-net

volumes:
  postgres_data:

networks:
  default:
    driver: bridge
  postal_postal-net:
    external: true
